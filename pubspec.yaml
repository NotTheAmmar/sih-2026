name: sih_26_kalakriti
description: "KalaKriti AI — Voice-First Studio & Commerce Engine for Marginalized Artisans (SIH 2026)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Camera & image
  camera: ^0.12.1
  image_picker: ^1.1.2
  image: ^4.3.0

  # Audio
  record: ^7.1.1
  audioplayers: ^6.4.0
  flutter_tts: ^4.2.2

  # Environment
  flutter_dotenv: ^5.2.1

  # Typography
  google_fonts: ^6.2.1

  # UI helpers
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3
  http: ^1.3.0
  http_parser: ^4.1.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.15

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
